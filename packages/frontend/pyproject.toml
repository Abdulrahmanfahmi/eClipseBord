[project]
name = "frontend"
version = "0.1.0"
description = "eClipseBord Streamlit dashboard"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.38",
    "requests>=2.32",
    "pandas>=2.2",
    "plotly>=5.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontend"]